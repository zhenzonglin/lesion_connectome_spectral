# 正式双队列主配置。所有路径、字段和统计参数都在本文件集中管理。
# 不能在配置中执行 Python/R 表达式；固定方法合同由 functions/configuration.py 校验。
# 一、paths：发现/验证病灶和临床输入目录；reference 是冻结健康底座；results 保存正式输出。
# 二、subjects：每个队列的文件模式和 ID 提取规则。pattern 仅一个 *；复杂文件名用 id_rule.id_regex。
# 三、imaging：1 mm MNI 空间与 LQT135 健康底座合同，nodes/active_nodes/modes/edges 为固定属性。
# 四、clinical：每个队列自动读取其子目录中的全部 SAS；field_map 是验证队列的显式字段覆盖。
# 五、statistics：G/W 损伤通道、MI、模型和四个 FDR 家族（MoCA 三个月份共用 moca 家族）。
# 六、patterns：20 个发现集组合模式；validation 只应用冻结后的权重和标准化参数。
# 七、annotation/runtime：注释零模型、300 dpi 图片和可恢复运行设置。

schema_version: 2
paths:
  lesion:
    discovery: lesion/discovery
    validation: lesion/validation
  clinical:
    discovery: clinical/discovery
    validation: clinical/validation
  reference: reference
  results: results
  annotation: reference/annotation
subjects:
  cohorts:
    discovery:
      pattern: sub-*_lesion.nii.gz
      id_rule:
        prefix: sub-
        suffix: _lesion.nii.gz
        id_regex: null
      participants: null
    validation:
      pattern: sub-*_lesion.nii.gz
      id_rule:
        prefix: sub-
        suffix: _lesion.nii.gz
        id_regex: null
      participants: null
  pattern: sub-*_lesion.nii.gz
  default: all
  participants: null
